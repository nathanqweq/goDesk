default:
  client: "Cliente padrao" # opcional no Go (nao e editado pelo modulo PHP)
  urgency: "Baixa"
  impact: "Sem impacto"
  priority: "" # opcional
  autoclose: false

  topdesk:
    contract: "CONTRATO_PADRAO"
    operator: "ID_OPERADOR_PADRAO"
    oper_group: "ID_GRUPO_PADRAO"
    main_caller: "monitoramento@empresa.com"
    secundary_caller: ""
    sla: "ID_SLA_PADRAO"
    category: "7 - Monitoramento"
    sub_category: "Monitoramento CONTRATO_PADRAO"
    send_more_info: false
    more_info_text: ""
    adicional_cresol: false
    send_email: false
    email_to: ""
    email_cc: ""
    call_type: "Resolucao de incidente"

# Clientes nomeados: cadastre um cliente uma vez e todas as rules que o
# referenciam (abaixo, em "rules") herdam esse TopDesk sem precisar
# repetir contract/operator/oper_group/sla/etc em cada regra.
clients:
  CRESOL:
    topdesk:
      contract: "CONTRATO_CRESOL"
      operator: "ID_OPERADOR_CRESOL"
      oper_group: "ID_GRUPO_CRESOL"
      main_caller: "noc@empresa.com"
      secundary_caller: ""
      sla: "ID_SLA_CRESOL"
      category: "7 - Monitoramento"
      sub_category: "Monitoramento CRESOL"
      send_more_info: false
      more_info_text: ""
      adicional_cresol: false
      send_email: false
      email_to: ""
      email_cc: ""
      call_type: "Resolucao de incidente"

# Rules: a chave precisa bater com RAWDATA.rule_name (EVENT.TAGS.RuleName
# no Zabbix). "client" referencia um nome cadastrado em "clients:" acima —
# só é preciso preencher aqui o que de fato varia por regra (urgency,
# impact, priority, autoclose, e overrides pontuais de topdesk como
# more_info_text). Campos de topdesk vazios herdam do cliente; os 3
# booleanos (send_more_info/adicional_cresol/send_email) sempre vem do
# cliente quando "client" está preenchido.
rules:
  CRESOL-AP-SW:
    client: "CRESOL"
    urgency: "Baixa"
    impact: "Sem impacto"
    priority: "" # opcional
    autoclose: false
    topdesk:
      more_info_text: ""
