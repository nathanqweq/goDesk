name: Publish APT repository

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg

      - name: Build .deb
        run: bash packaging/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Prepare gh-pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git worktree add -B gh-pages gh-pages-checkout origin/gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages-checkout
            git -C gh-pages-checkout rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Publish to APT repository
        env:
          DEB_FILE: ${{ github.workspace }}/build/godesk_${{ steps.version.outputs.version }}_amd64.deb
          GHPAGES_DIR: ${{ github.workspace }}/gh-pages-checkout
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: bash packaging/publish-apt-repo.sh

      - name: Commit and push gh-pages
        working-directory: gh-pages-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "publish godesk ${{ steps.version.outputs.version }}" || echo "nada para commitar"
          git push origin HEAD:gh-pages

      - name: Attach .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/godesk_${{ steps.version.outputs.version }}_amd64.deb
